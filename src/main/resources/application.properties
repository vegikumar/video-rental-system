spring.application.name=rentvideo
server.port=8080

# MySQL configuration — update username/password for your local MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/rentvideo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Uncomment the lines below to run with H2 in-memory DB (no MySQL required)
# spring.datasource.url=jdbc:h2:mem:rentvideo;DB_CLOSE_DELAY=-1;MODE=MySQL
# spring.datasource.username=sa
# spring.datasource.password=
# spring.datasource.driver-class-name=org.h2.Driver
# spring.h2.console.enabled=true
